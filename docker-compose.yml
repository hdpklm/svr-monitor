services:
  mysql:
    container_name: mysql-monitor
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - type: bind
        source: ${MYSQL_STORAGE:-/docker/storage}
        target: /var/lib/mysql
      - type: bind
        source: ./backend/schema.sql
        target: /docker-entrypoint-initdb.d/schema.sql
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    container_name: vps-monitor
    build:
      context: ./backend
      dockerfile: ${DOCKERFILE:-Dockerfile.web}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./backend
        target: /app
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      BASE_URL: ${BASE_URL:-http://localhost:8000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:-super_secret_debug_key}
      DONATE_URL: ${DONATE_URL:-}
      MAX_DEVICES: ${MAX_DEVICES:-10}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      DEBUG: ${DEBUG:-false}
    ports:
      - "127.0.0.1:8000:8000"
