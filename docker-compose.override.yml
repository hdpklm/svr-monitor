services:
  mysql:
    container_name: mysql-monitor
    volumes:
      - type: bind
        source: ./backend/schema_web.sql
        target: /docker-entrypoint-initdb.d/zz_schema_web.sql
        read_only: true

  backend:
    container_name: vps-monitor
    build:
      context: ./backend
      dockerfile: Dockerfile.web
    volumes:
      - type: bind
        source: ./backend
        target: /app
    environment:
      BASE_URL: ${BASE_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      DONATE_URL: ${DONATE_URL:-}
      MAX_DEVICES: ${MAX_DEVICES:-10}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
